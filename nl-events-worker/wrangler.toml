name = "daejong-nl-events"
main = "src/index.js"
compatibility_date = "2026-09-07"
workers_dev = true

# Production storage is D1. Without this binding the worker reports
# storage=unavailable (HTTP 503) and does not pretend memory succeeded.
# After `wrangler d1 create daejong-nl-events`, uncomment and set database_id.
# [[d1_databases]]
# binding = "NL_EVENTS"
# database_name = "daejong-nl-events"
# database_id = ""

# CSV read: wrangler secret put NL_EVENTS_READ_KEY  (do not commit the value)
# Frontend origin: set PUBLIC_NL_EVENTS_ORIGIN to the URL wrangler deploy prints.
# Do not invent *.ssamssae.workers.dev.
